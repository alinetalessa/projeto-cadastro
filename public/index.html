
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de pessoas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="cabecalho">
            <h1>Cadastro de pessoas</h1>
            <p>Gerencie os cadastros de forma simples e organizada.</p>
        </header>

        <form id="formCadastro">

            <div class="campos-formulario">

                <label for="nome">
                    Nome: <span class="obrigatorio">*</span>
                </label>
                <input type="text" id="nome" name="nome" required>

                <label for="idade">
                    Idade: <span class="obrigatorio">*</span>
                </label>
                <input type="number" id="idade" name="idade" required>

                <label for="dataNascimento">
                    Data de nascimento: <span class="obrigatorio">*</span>
                </label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>

            </div>

            <button type="submit" id="botaoSalvar">Cadastrar</button>
            <button type="button" id="botaoCancelar" style="display:none;">Cancelar edição</button>

        </form>

        <table border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Data de Nascimento</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaPessoas"></tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
